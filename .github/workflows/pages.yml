name: Build and deploy WASM demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'wasm/**'
      - 'tools/**'
      - 'data/**'
      - 'docs/index.html'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM module
        run: |
          mkdir -p docs
          cp data/btc_price_history.csv docs/btc_price_history.csv
          em++ -std=c++20 -O2 -fexceptions \
            -I include \
            src/black_scholes.cpp src/greeks.cpp src/tree_pricer.cpp src/monte_carlo.cpp src/implied_vol.cpp src/day_count.cpp src/heston.cpp src/tape2.cpp src/exotic_options.cpp src/bates.cpp src/price_history.cpp src/backtest.cpp src/portfolio.cpp src/var.cpp \
            wasm/wasm_bridge.cpp \
            -s MODULARIZE=1 -s EXPORT_NAME=createDerivEngine -s ENVIRONMENT=web \
            -s EXPORTED_FUNCTIONS='["_bridge_bs_price","_bridge_bs_greeks","_bridge_tree_price_european","_bridge_tree_price_american","_bridge_trinomial_price_european","_bridge_trinomial_price_american","_bridge_mc_price","_bridge_implied_vol","_bridge_heston_price","_bridge_asian_price","_bridge_geometric_asian_closed_form","_bridge_barrier_price","_bridge_down_and_out_call_closed_form","_bridge_bates_price","_bridge_load_price_history","_bridge_history_size","_bridge_run_backtest","_bridge_backtest_window_count","_bridge_backtest_window_pnl_bps","_bridge_run_var","_bridge_run_stress_test","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","getValue","setValue","stringToUTF8","lengthBytesUTF8"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s SINGLE_FILE=1 \
            -o docs/deriv_engine.js

      - name: Install real headers for native build
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Build and run the real test suite
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/tests | tee /tmp/test_output.txt

      - name: Compute real headline stats
        run: |
          TEST_OUTPUT=$(cat /tmp/test_output.txt)
          TESTS=$(echo "$TEST_OUTPUT" | grep -oE '[0-9]+ test cases' | grep -oE '^[0-9]+')
          ASSERTIONS=$(echo "$TEST_OUTPUT" | grep -oE '[0-9]+ assertions' | grep -oE '^[0-9]+')

          g++ -std=c++20 -O2 -I include \
            tools/gen_stats.cpp src/vol_surface.cpp src/implied_vol.cpp src/black_scholes.cpp src/greeks.cpp src/tape2.cpp src/day_count.cpp \
            -o build/gen_stats
          ./build/gen_stats > /tmp/calib_stats.json

          TESTS="$TESTS" ASSERTIONS="$ASSERTIONS" python3 - << 'PYEOF'
          import json, os

          with open('/tmp/calib_stats.json') as f:
              stats = json.load(f)

          stats['tests'] = int(os.environ['TESTS'])
          stats['assertions'] = int(os.environ['ASSERTIONS'])

          with open('docs/stats.json', 'w') as f:
              json.dump(stats, f, indent=2)
              f.write('\n')

          print(json.dumps(stats, indent=2))
          PYEOF

      - name: Calibrate Heston to real market data
        run: |
          g++ -std=c++20 -O2 -I include \
            tools/calibrate_heston.cpp src/heston.cpp src/heston_calibration.cpp src/vol_surface.cpp src/implied_vol.cpp src/black_scholes.cpp src/greeks.cpp src/tape2.cpp src/day_count.cpp \
            -o build/calibrate_heston
          ./build/calibrate_heston > docs/heston_calibration.json
          cat docs/heston_calibration.json

      - name: Commit rebuilt assets if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/deriv_engine.js docs/stats.json docs/heston_calibration.json docs/btc_price_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild WASM demo and refresh live stats [skip ci]"
            git push
          else
            echo "No changes to docs/deriv_engine.js, docs/stats.json, or docs/heston_calibration.json — skipping commit"
          fi
