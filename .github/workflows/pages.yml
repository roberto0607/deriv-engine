name: Build and deploy WASM demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'wasm/**'
      - 'docs/index.html'
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM module
        run: |
          mkdir -p docs
          em++ -std=c++20 -O2 \
            -I include \
            src/black_scholes.cpp src/greeks.cpp src/tree_pricer.cpp src/monte_carlo.cpp src/implied_vol.cpp src/day_count.cpp \
            wasm/wasm_bridge.cpp \
            -s MODULARIZE=1 -s EXPORT_NAME=createDerivEngine -s ENVIRONMENT=web \
            -s EXPORTED_FUNCTIONS='["_bridge_bs_price","_bridge_bs_greeks","_bridge_tree_price_european","_bridge_tree_price_american","_bridge_mc_price","_bridge_implied_vol","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","getValue","setValue"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s SINGLE_FILE=1 \
            -o docs/deriv_engine.js

      - name: Commit rebuilt WASM if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/deriv_engine.js; then
            git add docs/deriv_engine.js
            git commit -m "chore: rebuild WASM demo [skip ci]"
            git push
          else
            echo "No changes to docs/deriv_engine.js — skipping commit"
          fi
